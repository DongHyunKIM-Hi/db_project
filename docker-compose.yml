services:
  app:
    build: .
    container_name: bookstore-app
    environment:
      # DB는 이제 AWS(RDS)에 — 접속 정보는 전부 .env에서 (RDS 토픽 ④)
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      # 데이터가 유지되는 DB이므로 재시작마다 테이블을 지우지 않게 update로
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # S3 접근용 — AWS 키에는 기본값을 일부러 두지 않는다
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
    ports:
      - "8080:8080"

  # ── 모니터링 스택: 수집기(Prometheus) + 화면(Grafana) ──────────────
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # compose 전용 설정 — target 이 host.docker.internal 이 아니라 app:8080
      - ./monitoring/compose/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      # 로그인 없이 바로 보기 — 수업 시연용. 실무에선 절대 이렇게 두지 않는다
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      # 데이터소스만 compose 전용(주소가 prometheus:9090), 나머지는 demo 와 공유
      - ./monitoring/compose/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

