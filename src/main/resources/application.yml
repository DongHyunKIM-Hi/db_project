spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/db_project
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

logging:
  # 로그 한 줄마다 요청 id 가 찍힙니다. RequestIdFilter 가 MDC 에 넣어 준 값입니다.
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{20} - %msg%n"
  level:
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.transaction.interceptor: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG

# 모니터링 시연: /actuator/health, /actuator/prometheus 열기
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# S3 연동 — 비밀이 아닌 값만 적는다. 키는 환경변수로만 들어온다 (교안 ④)
app:
  s3:
    bucket: ${S3_BUCKET:bookstore-kim-0412}
    region: ${AWS_REGION:ap-northeast-2}
