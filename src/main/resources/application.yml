spring:
  # 접속 정보는 환경변수로 덮어쓸 수 있다. 기본값은 compose 의 db 컨테이너(호스트 5433).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db_project}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:create}
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # 기본 한도가 1MB 라 사진 한 장에도 걸린다. 표지 업로드용으로 올려 둔다. (교안 ④)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  # 로그 한 줄마다 요청 id 가 찍힙니다. RequestIdFilter 가 MDC 에 넣어 준 값입니다.
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{20} - %msg%n"
  level:
    org.hibernate.orm.jdbc.bind: trace
    org.springframework.transaction.interceptor: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG

# 모니터링 시연: /actuator/health, /actuator/prometheus 열기
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# S3 연동 — 비밀이 아닌 값만 적는다. 키는 환경변수로만 들어온다 (교안 ④)
app:
  s3:
    bucket: ${S3_BUCKET:CHANGE-ME-본인-버킷-이름}
    region: ${AWS_REGION:ap-northeast-2}
